<script>
  const form = document.getElementById('registrationForm');
  form.addEventListener('submit', function(e) {
    e.preventDefault();
    const submitBtn = document.querySelector('button[type="submit"]');
    submitBtn.innerText = 'Mengirim...';
    submitBtn.disabled = true;

    // TEMPELKAN LINK YANG DICOPY TADI DI ANTARA TANDA KUTIP DI BAWAH INI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwxGcW5lzGc_QDCpz_4krc-PWas-eSntYyAPenjH971tDmKLo6YCRfySsskxcM-doRq/exec';

    const formData = new FormData();
    formData.append('nama', document.getElementById('nama').value);
    formData.append('email', document.getElementById('email').value);
    formData.append('whatsapp', document.getElementById('whatsapp').value);
    formData.append('kategori', document.getElementById('instansi').value);
    
    const detailAsal = document.getElementById('detail_asal');
    formData.append('detail_asal', detailAsal ? detailAsal.value : '-');
    formData.append('baca_novel', document.getElementById('baca_novel').value);

    fetch(scriptURL, { method: 'POST', body: formData })
      .then(response => response.json())
      .then(data => {
        alert(data.message);
        if (data.result === 'success') {
          form.reset();
        }
        submitBtn.innerText = 'Kirim Pendaftaran';
        submitBtn.disabled = false;
      })
      .catch(error => {
        alert('Gagal mengirim data. Pastikan link script sudah benar dan koneksi internet lancar.');
        submitBtn.innerText = 'Kirim Pendaftaran';
        submitBtn.disabled = false;
      });
  });
</script>
